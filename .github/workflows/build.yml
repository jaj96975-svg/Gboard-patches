name: Build Gboard Patches

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - run: chmod +x ./gradlew

      - run: ./gradlew :patches:buildAndroid generatePatchesList --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: gboard-patches-mpp
          path: "**/*.mpp"
          if-no-files-found: error
